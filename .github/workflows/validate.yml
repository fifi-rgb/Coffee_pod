name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate workflow JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('workflows/tassimo-price-tracker.json', 'utf8'))"

      - name: Check synchronized Code nodes
        run: node scripts/sync.js check

      - name: Check for local environment file
        shell: bash
        run: |
          if [[ -f .env ]]; then
            echo "A .env file must not be committed."
            exit 1
          fi
